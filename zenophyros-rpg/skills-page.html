<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Habilidades</title>

    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/skills-page.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="container">
      <section class="frame skills-page">
        <header class="skills-header">
          <h1>Habilidades</h1>

          <span id="skills-count" class="skills-count"> Habilidades: 0 </span>

          <div class="skills-toolbar">
            <input
              type="text"
              id="search-input"
              placeholder="Pesquisar habilidade..."
            />

            <select id="filter-class">
              <option value="">Todas as Classes</option>
            </select>

            <select id="filter-species">
              <option value="">Todas as Espécies</option>
            </select>

            <select id="filter-activation">
              <option value="">Todas as Ativações</option>
            </select>

            <select id="filter-types">
              <option value="">Todos os Tipos</option>
            </select>

            <select id="filter-origin">
              <option value="">Todas as Origens</option>
            </select>
          </div>
        </header>

        <section id="skills-list" class="skills-list">
          <!-- LISTA CONTROLADA POR JAVASCRIPT -->
        </section>

        <!-- MODAL DE HABILIDADE -->
        <div id="skill-modal" class="skill-modal hidden">
          <div class="skill-modal-content">
            <button id="close-modal" class="modal-close">X</button>

            <div id="modal-body">
              <h2 id="skill-name">skill-name</h2>

              <div class="modal-badges">
                <span id="species-badge" class="skill-badge">species-label</span>
                <span id="class-badge" class="skill-badge">class-label</span>
                <span id="activation-badge" class="skill-badge">activation-label</span>
                <span id="origin-tag" class="skill-tag">origin-label</span>
                <span id="school-tag" class="skill-tag">school-label</span>
              </div>

              <div class="modal-section">
                <h3>Resumo</h3>
                <p id="skill-summary">skill-summary</p>
              </div>

              <div id="requirements-section" class="modal-section">
                <h3>Pré-Requisitos</h3>

                <div id="skill-requirements" class="modal-box">
                  skill-requirements
                </div>
              </div>

              <div class="modal-section">
                <h3>Efeito</h3>
                <p id="skill-desc">skill-desc</p>
              </div>

              <div id="critical-section" class="modal-section">
                <h3>Crítico</h3>
                <p id="skill-critical">skill-critical</p>
              </div>

              <div id="cost-section" class="modal-section">
                <h3>Custo</h3>

                <div id="skill-cost" class="modal-box">skill-cost</div>
              </div>

              <div class="modal-section">
                <h3>Tipos</h3>

                <div id="skill-types" class="modal-badges">
                  <!-- badges -->
                </div>
              </div>

              <div class="modal-id">
                ID: <code id="skill-id">skill-id</code>
              </div>
            </div>
          </div>
        </div>
      </section>
      <a href="index.html" class="botao-link">
        <img src="./assets/icons/home-solid.svg" class="icon" alt="" />
        Menu
      </a>
    </main>
    <footer id="site-footer"><!-- Filled by footer.js--></footer>

    <script src="./js/utils.js"></script>
    <script src="./js/footer.js"></script>
    <script src="./js/pages/skill/skill-enums.js"></script>
    <script src="./js/pages/skill/skill-db.js"></script>
    <script src="./js/pages/skill/skill-ui.js"></script>
    <script src="./js/pages/skill-page.js"></script>
  </body>
</html>
